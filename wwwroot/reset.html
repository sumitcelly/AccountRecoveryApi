<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Synthetic Account Password Reset</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            padding: 40px; 
            background-color: #0f141c; 
            color: #00ffaa; 
        }
        .box { 
            border: 1px dashed #00ffaa; 
            padding: 25px; 
            width: 100%;
            max-width: 480px; 
            background-color: #161f2b; 
            box-sizing: border-box;
        }
        input { 
            background: #0f141c; 
            color: #fff; 
            border: 1px solid #00ffaa; 
            padding: 10px; 
            width: 100%; 
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 16px;
        }
        button { 
            background: #00ffaa; 
            color: #0f141c; 
            border: none; 
            padding: 12px 20px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #00cc88;
        }
        .error { 
            color: #ff3333; 
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h2>Synthetic Account Password Reset</h2>
    <div class="box" id="form-container">
        <p>Checking the reset link...</p>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const container = document.getElementById('form-container');

        // Verify token existence immediately on client side without revealing directory details
        if (!token) {
            container.textContent = "This reset link is invalid or missing.";
        } else {
            container.innerHTML = `
                <label for="pass">New synthetic account password:</label><br><br>
                <input type="password" id="pass" placeholder="At least 8 characters" autocomplete="new-password" required>
                <button id="submit-reset">Reset password</button>
                <p id="err-msg" class="error"></p>
            `;
            document.getElementById("submit-reset").addEventListener("click", executeReset);
        }

        async function executeReset() {
            const passwordField = document.getElementById('pass');
            const password = passwordField.value;
            const msg = document.getElementById('err-msg');
            msg.textContent = "";
            
            try {
                const res = await fetch('/api/recovery/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    container.innerHTML = `
                        <h3>Password reset complete</h3>
                        <p>Receipt: <strong>${data.receipt}</strong></p>
                        <p>This synthetic account password was updated. You may close this page.</p>
                    `;
                } else {
                    msg.textContent = `${data.code}: ${data.description}`;
                }
            } catch (err) {
                msg.textContent = "Unable to contact the recovery service.";
            } finally {
                passwordField.value = "";
            }
        }
    </script>
</body>
</html>
